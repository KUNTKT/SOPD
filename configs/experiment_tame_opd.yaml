  evolve_n: 80
  train_limit: 1200
  inner_train_n: 80
  meta_select_n: 60
  probe_confirm_n: 100

prompt:
  few_shot: true
  history_window: 12

rollout:
  backend: hf
  max_steps: 40
  max_new_tokens: 32
  temperature: 1.0
  top_p: 1.0
