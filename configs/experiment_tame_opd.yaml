  M1: 11
  M2: 12
  M3: 13
  M4: 14

editor:
  temperature: 0.7
  max_new_tokens: 256
  enable_thinking: false

probe:
  optimizer_steps: 64
  max_supervised_tokens_per_seed: 4096
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 1.0e-4
  teacher_temperature: 1.0
  student_temperature: 1.0
  gradient_clip: 1.0
  max_length: 3072

distill:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  learning_rate: 1.0e-4
  teacher_temperature: 1.0
  student_temperature: 1.0
  gradient_clip: 1.0
  max_length: 3072

gate:
  n_boot: 10000
  bootstrap_seed: 0
  min_delta_m0_pp: 3.0
  teacher_slack_pp: 2.0
  fallback_rate_max: 0.05
  min_positive_seeds: 2
  sample_audit_n: 30

forbidden_splits: [valid_unseen]

