experiment_id: tame_opd_t0
code_version: tame_opd_t0_v1
dataset_version: alfworld_tw_2.1.1
random_seed: 1010
manifest_seed: 3030
python: /scratch/ktang115/envs/bootstrap_alignment/bin/python

model:
  name: Qwen3-1.7B
  path: /scratch/ktang115/models/Qwen3-1.7B
  torch_dtype: bfloat16
  device: cuda
  local_files_only: true
  use_cache: true
  enable_thinking: false
